<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JC Blowers | Visual Content Management System</title>
    <!-- 引入全球最高安全级别的 Decap Headless CMS 核心驱动引擎 -->
    <script src="https://unpkg.com@^3.0.0/dist/decap-cms.js"></script>
    <!-- 引入身份验证网关挂件，强制冲碎浏览器的拦截过滤 -->
    </script>
</head>
<body>
    <script>
        // 绑定你在 Netlify 激活的 Git-Gateway 黄金安全令牌密匙
        CMS.init({
            config: {
                backend: {
                    name: 'git-gateway',
                    branch: 'main'
                },
                media_folder: 'images',
                public_folder: '/images',
                collections: [
                    {
                        name: 'products',
                        label: 'Industrial Products Portfolio',
                        folder: '_products',
                        create: true,
                        slug: '{{slug}}',
                        fields: [
                            {label: 'Product Title', name: 'title', widget: 'string'},
                            {label: 'Model Number', name: 'model', widget: 'string'},
                            {label: 'Milling Configuration', name: 'milling', widget: 'string', default: '5-Axis Single Pass Monoblock'},
                            {label: 'Material Baseline', name: 'material', widget: 'string', default: '7075 T6 Aluminum / Titanium'},
                            {label: 'Rotation Speed Limit', name: 'rotation', widget: 'string', default: '20,000 - 100,000 RPM'},
                            {label: 'Verification Metric', name: 'verification', widget: 'string', default: 'Hexagon CMM Profiling Log'},
                            {label: 'Cover Image', name: 'image', widget: 'image'},
                            {label: 'Detailed Specifications', name: 'body', widget: 'markdown'}
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
