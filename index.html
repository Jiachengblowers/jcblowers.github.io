<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC Blowers | Premium 5-Axis CNC Impeller Factory & Heavy-Duty Blower Housing</title>
    <style>
        :root {
            --primary: #0a192f;       
            --accent: #ff5722;        
            --dark: #111827;
            --light-bg: #f9fafb;
            --border: #e5e7eb;
            --text-muted: #6b7280;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--dark);
            line-height: 1.6;
            background-color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .top-bar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 10px 0;
            font-size: 14px;
        }

        .top-bar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .top-bar a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .navbar {
            background-color: var(--primary);
            color: #ffffff;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 25px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .hero {
            /* HIGH-SPEED STABLE INDUSTRIAL CDN BACKGROUND */
            background: linear-gradient(rgba(10, 25, 47, 0.95), rgba(10, 25, 47, 0.95)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            color: #ffffff;
            padding: 120px 0;
            text-align: center;
        }

        .hero h1 {
            font-size: 44px;
            margin: 0 0 20px 0;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 19px;
            max-width: 800px;
            margin: 0 auto 40px auto;
            color: #cbd5e1;
        }

        .btn-cta {
            background-color: var(--accent);
            color: #ffffff;
            padding: 14px 35px;
            text-decoration: none;
            font-weight: 700;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-block;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-cta:hover {
            background-color: #e04716;
            transform: translateY(-2px);
        }

        .section {
            padding: 90px 0;
        }

        .section-grey {
            background-color: var(--light-bg);
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 34px;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 800;
            margin: 0 0 15px 0;
        }

        .section-title p {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 650px;
            margin: 0 auto;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
        }

        .product-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.06);
        }

        .img-container {
            background-color: #e5e7eb;
            height: 240px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: var(--accent);
            color: #ffffff;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 2px;
        }

        .product-card h3 {
            font-size: 20px;
            color: var(--primary);
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .product-model {
            color: var(--accent);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .specs-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 13.5px;
        }

        .specs-table tr {
            border-bottom: 1px solid #f3f4f6;
        }

        .specs-table td {
            padding: 8px 0;
        }

        .specs-table td.lbl {
            font-weight: 600;
            color: var(--primary);
            width: 45%;
        }

        .btn-video {
            background-color: #cc181e;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
        }

        .btn-quote {
            background-color: var(--primary);
            color: #ffffff;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: block;
        }

        .metrics-wrapper {
            display: flex;
            gap: 50px;
            align-items: center;
            flex-wrap: wrap;
        }

        .metrics-text {
            flex: 1.2;
            min-width: 320px;
        }

        .metrics-text h3 {
            font-size: 28px;
            color: var(--primary);
            margin-top: 0;
        }

        .metrics-grid {
            flex: 1;
            min-width: 300px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .metric-box {
            background-color: var(--primary);
            color: #ffffff;
            padding: 25px;
            border-radius: 4px;
            text-align: center;
        }

        .metric-box h4 {
            font-size: 36px;
            margin: 0;
            color: var(--accent);
            font-weight: 800;
        }

        .metric-box p {
            margin: 5px 0 0 0;
            font-size: 13.5px;
            color: #94a3b8;
        }

        .footer {
            background-color: #060f1e;
            color: #94a3b8;
            padding: 60px 0 30px 0;
            font-size: 14px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 40px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 40px;
            margin-bottom: 30px;
        }

        .footer-col h5 {
            color: #ffffff;
            font-size: 15px;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-links li {
            margin-bottom: 12px;
        }

        .footer-links li a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links li a:hover {
            color: #ffffff;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .top-bar .container, .navbar .container {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            .nav-links {
                flex-direction: column;
                gap: 8px;
                width: 100%;
            }
            .hero h1 {
                font-size: 32px;
            }
            .metrics-wrapper {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
